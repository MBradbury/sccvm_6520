# sccm_6520 - sccvm module configuration
#
# This file becomes /etc/sccvm/conf.d/sccm_6520.toml on the lab machines.
# - The filename is the module: sccm_6520.toml shows up as the "SCCM_6520" tab.
# - Script paths point at $HOME/.sccm_6520/bin/, where each student's copy of
#   this repo's bin/ folder will live. Keep that prefix, change only the script name.
# - VM names come from the launch script filenames, which are the source of
#   truth. bin/sccm_6520_launch_<vm> needs an entry [vms.sccm_6520_<vm>], with
#   name set to the same value.
# - This file is edited directly (not generated), as every lab is set up differently.
#   Run tools/check.sh after editing to catch anything that doesn't match bin/.

# ---- Module ----------------------------------------------------------------
[module]
description = "SCCM_6520 - Secure Cyber Physical Systems"
disclaimer = "These VMs should only be used as directed by your instructor. You must not launch these VMs unless you have been given explicit permission to do so by Matthew Bradbury (m.s.bradbury@lancaster.ac.uk) or Paul Smith (paul.smith@lancaster.ac.uk)."

# Quick actions shown at the top of the module tab (optional, remove if not needed).
# mode: "vm"     - start the VMs
#       "spice"  - open SPICE consoles only
#       "both"   - start the VMs and open a SPICE console for each
#       "vm_with_kali_spice" - start all VMs, SPICE console only for VMs with "kali" in their name
[[module.actions]]
name = "Launch Lab VMs"
description = "Start all lab VMs"
vm_names = ["sccm_6520_asherah"]
mode = "vm"

[[module.actions]]
name = "Open Lab SPICE"
description = "Open the SPICE console for the Kali VM"
vm_names = ["sccm_6520_asherah"]
mode = "spice"

# ---- VMs -------------------------------------------------------------------
[vms.sccm_6520_asherah]
name = "sccm_6520_asherah"
display_name = "Asherah"
script = "$HOME/.sccm_6520/bin/sccm_6520_launch_asherah"
spice_script = "$HOME/.sccm_6520/bin/sccm_6520_spice_asherah"
description = "The Asherah Nuclear Power Plant Simulator"
category = "Main Lab"
module = "SCCM_6520"
tags = ["sccm_6520", "asherah", "main-lab"]
